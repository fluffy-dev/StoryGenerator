services:
  python-api:
    build: ./story_generator_py
    container_name: story_gen_python
    ports:
      - "8000:8000"
    networks:
      - app-network
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/docs" ]
      interval: 30s
      timeout: 10s
      retries: 3

  php-frontend:
    image: yiisoftware/yii2-php:8.4-apache
    container_name: story_gen_php
    volumes:
      - ./yii2-app:/app
      - ./yii2-app/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
      python-api:
        condition: service_started
    env_file:
      - .env
    entrypoint: [ "sh", "/usr/local/bin/docker-entrypoint.sh" ]
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    container_name: story_gen_db
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U yii2user -d yii2db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge